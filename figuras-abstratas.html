<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusão Retângulo e Triângulo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ecf0f1;
            font-family: sans-serif;
            flex-direction: column;
        }

        .base-retangulo {
            width: 150px;
            height: 120px;
            background-color: #2ecc71;
            position: relative;
            margin-top: 0px;
        }

        .triangulo {
            margin-bottom: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-bottom: 80px solid #2ecc71;
            width: 0;
            height: 0;
        }

        h1 {
            color: #2c3e50;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="triangulo"></div>
    <div class="base-retangulo"></div>
</body>
</html>
